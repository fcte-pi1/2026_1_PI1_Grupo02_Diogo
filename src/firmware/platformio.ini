; =====================================================================
; CONFIGURAÇÃO GLOBAL DO PROJETO MICROMOUSE
; =====================================================================

; ---------------------------------------------------------------------
; Ambiente 1: Desenvolvimento Físico na Placa DevKit V1 (Bancada Local)
; A Placa configurada atualmente foi testada e validada, por favor
; NÃO altere a configuração do ambiente 'esp32dev' nem a velocidade do monitor.
; ---------------------------------------------------------------------

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit INA219@^1.2.3
    pololu/VL6180X@^1.2.0
    pololu/VL53L0X@^1.3.1

; 🔌 PORTAS USB LOCAIS: Comentadas para usar a varredura automática do PlatformIO.
; Se precisar travar em uma porta específica do Linux, mude o número e tire o ';'
; upload_port = /dev/ttyUSB1
; monitor_port = /dev/ttyUSB1

; ---------------------------------------------------------------------
; Ambiente 2: Upload via Wi-Fi (OTA)
; Uso: pio run -t upload -e esp32dev_ota
; Requisito: ESP32 já ligada, conectada ao Wi-Fi e com o firmware OTA rodando
; Se o IP mudar, altere upload_port para o IP atual da ESP32
; ---------------------------------------------------------------------
[env:esp32dev_ota]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed   = 115200
upload_protocol = espota
upload_port     = 192.168.1.9
lib_deps        = ${env:esp32dev.lib_deps}

; ---------------------------------------------------------------------
; Ambiente 3: Testes Automatizados na CI (GitHub Actions)
; ---------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
